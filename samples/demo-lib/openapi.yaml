openapi: 3.0.3
info:
  title: Demo API
  version: 0.1.0
  description: Демонстрационный контракт HTTP.
paths:
  /widgets:
    get:
      operationId: listWidgets
      summary: Список виджетов
      parameters:
        - name: limit
          in: query
          required: false
          description: Сколько элементов вернуть
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Успешный список
          content:
            application/json:
              example:
                - id: 1
                  name: demo
      security:
        - apiKey: []
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key

server {
    listen 80;
    server_name _;
    client_max_body_size 2m;

    # Имя api спрашивается у DNS Docker на каждый запрос, иначе после
    # пересоздания контейнера nginx держит старый адрес и отвечает 502.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /health {
        set $docloom_api api:8000;
        proxy_pass http://$docloom_api;
    }

    location /api/ {
        set $docloom_api api:8000;
        proxy_pass http://$docloom_api;
    }

    location /hooks/ {
        set $docloom_api api:8000;
        proxy_pass http://$docloom_api;
    }

    location /sites/ {
        root /usr/share/nginx/html;
        index index.html;
        error_page 404 =404 @docloom404;
        try_files $uri $uri/ $uri/index.html =404;
    }

    location @docloom404 {
        internal;
        root /usr/share/nginx/html;
        rewrite ^/sites/([^/]+)/([^/]+)/ /sites/$1/$2/404.html break;
    }
}

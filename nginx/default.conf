server {
    listen 80;
    server_name _;
    client_max_body_size 2m;

    location = /health {
        proxy_pass http://api:8000/health;
    }

    location /api/ {
        proxy_pass http://api:8000/api/;
    }

    location /hooks/ {
        proxy_pass http://api:8000/hooks/;
    }

    location /sites/ {
        root /usr/share/nginx/html;
        index index.html;
        error_page 404 =404 @docloom404;
        try_files $uri $uri/ $uri/index.html =404;
    }

    location @docloom404 {
        internal;
        root /usr/share/nginx/html;
        rewrite ^/sites/([^/]+)/([^/]+)/ /sites/$1/$2/404.html break;
    }
}

server {
    listen 80;
    server_name _;
    client_max_body_size 2m;

    location = /health {
        proxy_pass http://api:8000/health;
    }

    location /api/ {
        proxy_pass http://api:8000/api/;
    }

    location /hooks/ {
        proxy_pass http://api:8000/hooks/;
    }

    location /sites/ {
        alias /usr/share/nginx/html/sites/;
        index index.html;
    }
}
